version: "0.5"

processes:
  postgresql:
    command: |
      mkdir -p .devbox/postgres/run
      test -s .devbox/postgres/data/PG_VERSION || initdb --auth=trust --encoding=UTF8 --locale=C -D .devbox/postgres/data
      exec postgres -D .devbox/postgres/data -p $PGPORT -k "$PWD/.devbox/postgres/run" -c listen_addresses=127.0.0.1
    readiness_probe:
      exec:
        command: pg_isready -h 127.0.0.1 -p $PGPORT -d postgres
      period_seconds: 1
      failure_threshold: 30
    availability:
      restart: "always"

  init-db:
    command: scripts/devbox/init-db.sh
    depends_on:
      postgresql:
        condition: process_healthy

  phoenix:
    command: |
      mkdir -p data/phoenix
      exec env PHOENIX_WORKING_DIR="$PWD/data/phoenix" uvx --from arize-phoenix phoenix serve
    readiness_probe:
      exec:
        command: curl -fsS http://127.0.0.1:$PHOENIX_PORT >/dev/null
      initial_delay_seconds: 3
      period_seconds: 2
      failure_threshold: 150
    availability:
      restart: "always"

  server:
    command: |
      cd apps/server
      exec env DATABASE_URL="postgresql+psycopg://understand:understand@localhost:$PGPORT/understand_anypaper" OTEL_EXPORTER_OTLP_TRACES_ENDPOINT="http://localhost:$PHOENIX_PORT/v1/traces" OTEL_EXPORTER_OTLP_PROTOCOL="http/protobuf" OTEL_SERVICE_NAME="understand-anypaper-server" ENABLE_SENSITIVE_DATA="true" uv run uvicorn understand_anypaper.main:app --host 0.0.0.0 --port $API_PORT --reload
    depends_on:
      init-db:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: curl -fsS http://127.0.0.1:$API_PORT/health >/dev/null
      initial_delay_seconds: 1
      period_seconds: 2
      failure_threshold: 30
    availability:
      restart: "always"

  web:
    command: |
      cd apps/web
      test -d node_modules || npm install
      exec env VITE_API_BASE_URL="http://localhost:$API_PORT" npm run dev -- --port $WEB_PORT
    depends_on:
      server:
        condition: process_healthy
    availability:
      restart: "always"

  openvscode:
    command: |
      mkdir -p data/openvscode-user/User data/openvscode-server
      cp config/openvscode-settings.json data/openvscode-user/User/settings.json
      exec openvscode-server --host 127.0.0.1 --port $OPENVSCODE_PORT --without-connection-token --disable-telemetry --user-data-dir data/openvscode-user --server-data-dir data/openvscode-server
    readiness_probe:
      exec:
        command: curl -fsS http://127.0.0.1:$OPENVSCODE_PORT >/dev/null
      initial_delay_seconds: 2
      period_seconds: 2
      failure_threshold: 30
    availability:
      restart: "always"
